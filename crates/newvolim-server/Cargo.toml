[package]
name = "newvolim-server"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "Local allow-listed Palace frame service for newvolim"

[dependencies]
axum = { version = "0.8", features = ["json", "ws"] }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
csv = "1.3"
parquet = { version = "59.2", default-features = false }
bytes = "1"
zarrs = { version = "0.18", features = ["filesystem"] }
newvolim-io = { path = "../newvolim-io" }
newvolim-portable = { path = "../newvolim-portable" }
newvolim-residency = { path = "../newvolim-residency" }
newvolim-scene = { path = "../newvolim-scene" }
newvolim-render = { path = "../newvolim-render" }
palace-frame = { path = "../../palace-dev/palace-frame" }
palace-png = { path = "../../palace-dev/palace-png" }
palace-wgpu = { path = "../../palace-dev/palace-wgpu" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }

[dev-dependencies]
pollster = "1"
wgpu = "30"
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
