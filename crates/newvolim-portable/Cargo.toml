[package]
name = "newvolim-portable"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "Portable-renderer session and routes shared by the newvolim desktop and server"

[dependencies]
base64 = "0.22"
newvolim-io = { path = "../newvolim-io" }
newvolim-render = { path = "../newvolim-render" }
newvolim-residency = { path = "../newvolim-residency" }
newvolim-wgpu-frame = { path = "../newvolim-wgpu-frame" }
newvolim-scene = { path = "../newvolim-scene" }
palace-frame = { path = "../../palace-dev/palace-frame" }
palace-core = { path = "../../palace-dev/palace-core" }
palace-png = { path = "../../palace-dev/palace-png" }
palace-wgpu = { path = "../../palace-dev/palace-wgpu" }
pollster = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgpu = "30"

[dev-dependencies]
tempfile = "3"
zarrs = { version = "0.18", features = ["filesystem"] }
