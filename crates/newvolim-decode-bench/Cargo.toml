[package]
name = "newvolim-decode-bench"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "Reproducible native/wasm decoder measurement harness for newvolim Stage 0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
lz4_flex = "0.14"
zarrs = { version = "0.23", default-features = false, features = ["blosc"] }
zstd = { version = "0.13", features = ["wasm"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
