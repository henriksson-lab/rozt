[package]
name = "newvolim-ui"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "CSR Leptos canvas UI for newvolim"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
js-sys = "0.3"
leptos = { version = "0.8.19", features = ["csr"] }
newvolim-decode-bench = { path = "../newvolim-decode-bench" }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window"] }
