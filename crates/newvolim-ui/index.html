<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>newvolim</title>
    <link data-trunk rel="rust" data-wasm-opt="z" />
    <link data-trunk rel="css" href="style.css" />
  </head>
  <body>
    <script>
      // Native render targets, PNG backing stores, and WebGPU swap chains are all sized in
      // physical pixels. Keep CSS layout dimensions at the DOM boundary rather than leaking
      // them into the renderer request contract.
      window.newvolimPhysicalCanvasSize = function (canvas) {
        const scale = window.devicePixelRatio || 1;
        return {
          width: Math.max(1, Math.floor(canvas.clientWidth * scale)),
          height: Math.max(1, Math.floor(canvas.clientHeight * scale)),
        };
      };

      // Convert a CSS pointer position to a bounded physical render-target pixel. Keep this
      // calculation separate from DOM event handling so depth readback and future GPU picking
      // cannot accidentally use CSS pixels on high-DPI displays.
      window.newvolimPhysicalCanvasPoint = function (width, height, bounds, clientX, clientY) {
        if (!Number.isInteger(width) || !Number.isInteger(height) || width < 1 || height < 1
          || !Number.isFinite(bounds.width) || !Number.isFinite(bounds.height)
          || bounds.width <= 0 || bounds.height <= 0
          || !Number.isFinite(clientX) || !Number.isFinite(clientY)) {
          throw new Error("physical canvas point requires finite non-empty canvas geometry");
        }
        return {
          x: Math.min(width - 1, Math.max(0, Math.floor((clientX - bounds.left) * width / bounds.width))),
          y: Math.min(height - 1, Math.max(0, Math.floor((clientY - bounds.top) * height / bounds.height))),
        };
      };

      // A Palace PNG is display-encoded colour. Its renderer-owned first-opacity PFM sidecar is
      // optional, but a depth-capable declaration is valid only when that exact sidecar validates.
      window.newvolimValidateNativePngPayload = function (payload) {
        if (!payload || payload.mimeType !== "image/png" || typeof payload.dataUrl !== "string") {
          throw new Error("native frame payload must contain an image/png data URL");
        }
        if (!Number.isInteger(payload.width) || !Number.isInteger(payload.height)
          || payload.width < 1 || payload.height < 1) {
          throw new Error("native frame payload has an invalid physical extent");
        }
        const target = payload.target;
        const declaresRayDistance = typeof payload.rayDistancePfmBase64 === "string";
        const hasRayDistance = declaresRayDistance && window.newvolimValidateRayDistancePfm(
          payload.rayDistancePfmBase64, payload.width, payload.height,
        );
        const validDepth = target && (
          (target.depth === "none" && !declaresRayDistance)
          || (target.depth === "rayDistanceF32" && hasRayDistance)
        );
        if (!target || !target.extent || target.extent.width !== payload.width
          || target.extent.height !== payload.height
          || target.colorFormat !== "rgba8Unorm" || target.colorEncoding !== "srgb"
          || !validDepth || payload.progress !== "final") {
          throw new Error("native PNG payload violates the final attachment contract");
        }
        return payload;
      };

      // WebSocket frames carry base64 PNG bytes rather than a data URL. A future Palace paired
      // raycast may include a PFM first-opacity sidecar; the envelope must declare it exactly
      // when it is present rather than inventing depth from the display PNG.
      const NEWVOLIM_MAX_REMOTE_FRAME_PIXELS = 16 * 1024 * 1024;
      const NEWVOLIM_MAX_REMOTE_ENCODED_BYTES = NEWVOLIM_MAX_REMOTE_FRAME_PIXELS * 4 + 1024 * 1024;
      window.newvolimValidateRemotePngData = function (encoded, width, height) {
        try {
          // A lossless RGBA PNG should fit this bounded local-service transport budget. Check
          // encoded length before decoding, then confirm IHDR is the declared physical target.
          if (typeof encoded !== "string" || encoded.length > Math.ceil(NEWVOLIM_MAX_REMOTE_ENCODED_BYTES / 3) * 4) return false;
          const bytes = Uint8Array.from(atob(encoded), character => character.charCodeAt(0));
          if (bytes.length < 24
            || ![137, 80, 78, 71, 13, 10, 26, 10].every((value, index) => bytes[index] === value)
            || String.fromCharCode(...bytes.slice(12, 16)) !== "IHDR") return false;
          const dimensions = new DataView(bytes.buffer, bytes.byteOffset + 16, 8);
          return dimensions.getUint32(0, false) === width && dimensions.getUint32(4, false) === height;
        } catch (_) {
          return false;
        }
      };
      window.newvolimValidateRayDistancePfm = function (encoded, width, height) {
        try {
          const sampleBytes = width * height * 4;
          if (!Number.isSafeInteger(sampleBytes) || sampleBytes > NEWVOLIM_MAX_REMOTE_FRAME_PIXELS * 4) return false;
          const header = new TextEncoder().encode(`Pf\n${width} ${height}\n-1.0\n`);
          const totalBytes = header.length + sampleBytes;
          const encodedBytes = Math.ceil(totalBytes / 3) * 4;
          // Check the exact standard-base64 length before `atob` allocates its decoded string.
          if (encoded.length !== encodedBytes) return false;
          const bytes = Uint8Array.from(atob(encoded), character => character.charCodeAt(0));
          if (bytes.length !== totalBytes) return false;
          if (header.some((value, index) => bytes[index] !== value)) return false;
          const data = new DataView(bytes.buffer, bytes.byteOffset + header.length, sampleBytes);
          for (let offset = 0; offset < sampleBytes; offset += 4) {
            const value = data.getFloat32(offset, true);
            if (!(value >= 0 || value === Infinity)) return false;
          }
          return true;
        } catch (_) {
          return false;
        }
      };
      // Return one validated physical first-opacity distance at a top-left canvas pixel.
      // PFM rows are bottom-to-top, unlike DOM canvas coordinates; keep the conversion here so
      // future annotation picking cannot accidentally use vertically mirrored occlusion data.
      window.newvolimReadRayDistancePfm = function (encoded, width, height, x, y) {
        if (!Number.isInteger(x) || !Number.isInteger(y) || x < 0 || y < 0
          || x >= width || y >= height
          || !window.newvolimValidateRayDistancePfm(encoded, width, height)) {
          throw new Error("ray-distance PFM pixel is outside a validated attachment");
        }
        const headerLength = new TextEncoder().encode(`Pf\n${width} ${height}\n-1.0\n`).length;
        const bytes = Uint8Array.from(atob(encoded), character => character.charCodeAt(0));
        const row = height - 1 - y;
        const offset = headerLength + (row * width + x) * 4;
        const value = new DataView(bytes.buffer, bytes.byteOffset + offset, 4).getFloat32(0, true);
        if (!(value >= 0 || value === Infinity)) {
          throw new Error("ray-distance PFM contains an invalid physical distance");
        }
        return value;
      };
      window.newvolimValidateRemotePngFrame = function (frame) {
        const target = frame && frame.target;
        const declaresRayDistance = typeof frame?.rayDistancePfmBase64 === "string";
        const hasRayDistance = declaresRayDistance && window.newvolimValidateRayDistancePfm(
            frame.rayDistancePfmBase64, frame.width, frame.height,
          );
        const validDepth = target && (
          (target.depth === "none" && !declaresRayDistance)
          || (target.depth === "rayDistanceF32" && hasRayDistance)
        );
        return Boolean(frame && frame.mimeType === "image/png" && frame.progress === "final"
          && Number.isInteger(frame.width) && frame.width > 0
          && Number.isInteger(frame.height) && frame.height > 0
          && Number.isSafeInteger(frame.width * frame.height)
          && frame.width * frame.height <= NEWVOLIM_MAX_REMOTE_FRAME_PIXELS
          && target && target.extent && target.extent.width === frame.width
          && target.extent.height === frame.height && target.colorFormat === "rgba8Unorm"
          && target.colorEncoding === "srgb" && validDepth);
      };

      window.newvolimDrawPayload = async function (command, args) {
        const canvas = document.getElementById("newvolim-volume");
        const status = document.getElementById("newvolim-render-status");
        const generation = (window.newvolimVolumeGeneration || 0) + 1;
        window.newvolimVolumeGeneration = generation;
        try {
          if (!window.__TAURI__ || !window.__TAURI__.core) {
            await window.newvolimRenderBrowserSynthetic(canvas, generation);
            return;
          }
          status.textContent = "Rendering preview…";
          const payload = window.newvolimValidateNativePngPayload(
            await window.__TAURI__.core.invoke(command, args),
          );
          // Preserve only a validator-approved renderer attachment; it must never be inferred
          // from PNG alpha or treated as browser raster depth.
          window.newvolimNativeRayDistancePfm = payload.rayDistancePfmBase64 || null;
          window.newvolimNativePortableFrame = command === "render_native_portable_camera_draw";
          const image = new Image();
          image.onload = () => {
            if (generation !== window.newvolimVolumeGeneration) return;
            canvas.width = payload.width;
            canvas.height = payload.height;
            canvas.getContext("2d").drawImage(image, 0, 0);
            if (command === "render_open_dataset" || command === "render_native_portable_camera_draw") {
              window.newvolimAttachVolumeCameraControls(canvas);
            }
            status.textContent = window.newvolimNativePortableFrame
              ? "Native portable WGPU frame"
              : "Native Palace frame";
          };
          image.onerror = () => { status.textContent = "Frame decode failed"; };
          image.src = payload.dataUrl;
        } catch (error) {
          status.textContent = error.message || String(error);
        }
      };

      // Palace frames cannot be interrupted once submitted.  Keep exactly one request in flight
      // at the UI boundary and retain only the newest camera state behind it, matching the
      // backend-neutral RenderAdmission and the loopback frame service policy.
      window.newvolimFrameAdmission = { active: false, pending: null };
      window.newvolimAdmitFrame = async function (command, args) {
        const admission = window.newvolimFrameAdmission;
        if (admission.active) {
          admission.pending = { command, args };
          return;
        }
        admission.active = true;
        try {
          await window.newvolimDrawPayload(command, args);
        } finally {
          admission.active = false;
          const pending = admission.pending;
          admission.pending = null;
          if (pending) await window.newvolimAdmitFrame(pending.command, pending.args);
        }
      };

      // Remote frames use the same physical target and latest-request policy as native IPC.
      // A socket is intentionally a frame transport only; it never grants browser filesystem
      // access and the server remains the authority for its configured dataset registry.
      window.newvolimRemoteFrames = {
        socket: null, active: false, pending: null, nextId: 0, activeRequestId: null,
      };
      window.newvolimRequestRemoteFrame = function (camera = window.newvolimCamera, view = "volume", crosshair = null) {
        const remote = window.newvolimRemoteFrames;
        if (!remote.socket || remote.socket.readyState !== WebSocket.OPEN) return;
        const canvas = document.getElementById("newvolim-volume");
        const target = window.newvolimPhysicalCanvasSize(canvas);
        const request = {
          dataset: document.getElementById("newvolim-remote-dataset").value.trim(),
          width: target.width, height: target.height,
          orbitX: Math.round(camera.orbitX), orbitY: Math.round(camera.orbitY), zoom: camera.zoom,
          view,
          requestId: ++remote.nextId,
        };
        if (crosshair) { request.x = crosshair.x; request.y = crosshair.y; request.z = crosshair.z; }
        if (!/^[A-Za-z0-9_-]{1,64}$/.test(request.dataset)) {
          document.getElementById("newvolim-render-status").textContent = "Enter a configured remote dataset name";
          return;
        }
        if (remote.active) { remote.pending = request; return; }
        remote.active = true;
        remote.activeRequestId = request.requestId;
        remote.socket.send(JSON.stringify(request));
      };

      window.newvolimFinishRemoteFrame = function () {
        const remote = window.newvolimRemoteFrames;
        remote.active = false;
        remote.activeRequestId = null;
        const pending = remote.pending;
        remote.pending = null;
        if (pending) {
          remote.active = true;
          remote.activeRequestId = pending.requestId;
          remote.socket.send(JSON.stringify(pending));
        }
      };

      window.newvolimDrawRemoteFrame = function (frame) {
        const canvas = document.getElementById("newvolim-volume");
        const status = document.getElementById("newvolim-render-status");
        if (!window.newvolimValidateRemotePngFrame(frame)
          || !window.newvolimValidateRemotePngData(frame.dataBase64, frame.width, frame.height)
          || !Number.isFinite(frame.renderMs) || frame.renderMs < 0) {
          status.textContent = "Remote frame violated the expected final PNG contract";
          return;
        }
        // Preserve the paired transport payload for the future GPU compositing/picking path.
        // It is intentionally not interpreted as display alpha or browser raster depth here.
        window.newvolimRemoteRayDistancePfm = frame.rayDistancePfmBase64 || null;
        const image = new Image();
        image.onload = () => {
          canvas.width = frame.width;
          canvas.height = frame.height;
          canvas.getContext("2d").drawImage(image, 0, 0);
          window.newvolimAttachVolumeCameraControls(canvas);
          status.textContent = `Remote Palace frame #${frame.requestId} (${frame.renderMs.toFixed(1)} ms render)`;
        };
        image.onerror = () => { status.textContent = "Remote frame PNG decode failed"; };
        image.src = `data:image/png;base64,${frame.dataBase64}`;
      };

      window.newvolimDrawRemoteOrthogonal = function (frame) {
        const status = document.getElementById("newvolim-render-status");
        if (!window.newvolimValidateRemotePngFrame(frame)
          || !Number.isFinite(frame.renderMs) || frame.renderMs < 0) {
          status.textContent = "Remote orthogonal frame violated the expected PNG contract";
          return;
        }
        if (!Array.isArray(frame.voxelShapeXyz) || !Array.isArray(frame.crosshairXyz)
          || frame.voxelShapeXyz.length !== 3 || frame.crosshairXyz.length !== 3
          || frame.voxelShapeXyz.some(value => !Number.isInteger(value) || value < 1)
          || frame.crosshairXyz.some((value, axis) => !Number.isInteger(value) || value < 0 || value >= frame.voxelShapeXyz[axis])) {
          status.textContent = "Remote orthogonal frame has invalid voxel geometry";
          return;
        }
        window.newvolimCrosshairDimensions = frame.voxelShapeXyz;
        Object.assign(window.newvolimCrosshair, { x: frame.crosshairXyz[0], y: frame.crosshairXyz[1], z: frame.crosshairXyz[2] });
        for (const plane of ["xy", "xz", "yz"]) {
          const encoded = frame[`${plane}Base64`];
          if (!window.newvolimValidateRemotePngData(encoded, frame.width, frame.height)) {
            status.textContent = "Remote orthogonal frame omitted or malformed a pane"; return;
          }
          const canvas = document.getElementById(`newvolim-${plane}`);
          const image = new Image();
          image.onload = () => {
            canvas.width = frame.width; canvas.height = frame.height;
            canvas.getContext("2d").drawImage(image, 0, 0);
            window.newvolimDrawCrosshair(canvas.getContext("2d"), plane, canvas.width, canvas.height);
            canvas.onclick = event => window.newvolimMoveCrosshair(plane, event, "remote");
          };
          image.src = `data:image/png;base64,${encoded}`;
        }
        status.textContent = `Remote Palace volume + orthogonal slices #${frame.requestId} (${frame.renderMs.toFixed(1)} ms slices)`;
      };

      window.newvolimOpenRemoteFrameServer = function () {
        const status = document.getElementById("newvolim-render-status");
        const rawUrl = document.getElementById("newvolim-remote-url").value.trim();
        let endpoint;
        try {
          endpoint = new URL(rawUrl);
          if (endpoint.protocol !== "ws:" && endpoint.protocol !== "wss:") throw new Error("URL must use ws: or wss:");
        } catch (error) {
          status.textContent = error.message || String(error);
          return;
        }
        if (window.newvolimRemoteFrames.socket) window.newvolimRemoteFrames.socket.close();
        const socket = new WebSocket(endpoint);
        window.newvolimRemoteFrames = {
          socket, active: false, pending: null, nextId: 0, activeRequestId: null,
        };
        status.textContent = "Connecting to remote frame server…";
        socket.addEventListener("open", () => window.newvolimRequestRemoteFrame());
        socket.addEventListener("message", event => {
          const remote = window.newvolimRemoteFrames;
          if (remote.socket !== socket) return;
          let response;
          try { response = JSON.parse(event.data); } catch (_) {
            status.textContent = "Remote frame server sent invalid JSON";
            window.newvolimFinishRemoteFrame();
            return;
          }
          if (response.requestId !== remote.activeRequestId) {
            status.textContent = "Remote frame server sent a stale or unsolicited response";
            return;
          }
          if (response.type === "frame") {
            window.newvolimDrawRemoteFrame(response);
            window.newvolimRequestRemoteFrame(window.newvolimCamera, "orthogonal");
          } else if (response.type === "orthogonal") window.newvolimDrawRemoteOrthogonal(response);
          else status.textContent = response.message || "Remote frame request failed";
          window.newvolimFinishRemoteFrame();
        });
        socket.addEventListener("close", () => {
          if (window.newvolimRemoteFrames.socket === socket) {
            window.newvolimRemoteFrames.socket = null;
            window.newvolimRemoteFrames.active = false;
            window.newvolimRemoteFrames.activeRequestId = null;
          }
        });
        socket.addEventListener("error", () => { status.textContent = "Remote frame WebSocket failed"; });
      };

      window.newvolimProbeWebGpu = async function () {
        const status = document.getElementById("newvolim-render-status");
        if (window.newvolimBrowserGpu?.adapter) return window.newvolimBrowserGpu.adapter;
        if (!navigator.gpu) {
          status.textContent = "WebGPU is unavailable; use a current WebGPU-capable browser";
          return null;
        }
        const adapter = await navigator.gpu.requestAdapter();
        if (!adapter) {
          status.textContent = "WebGPU is present but no adapter was granted";
          return null;
        }
        const info = adapter.info ? await adapter.info : null;
        status.textContent = info && info.description
          ? `WebGPU adapter available: ${info.description}`
          : "WebGPU adapter available (browser renderer pending)";
        window.newvolimBrowserGpu = { adapter, device: null };
        return adapter;
      };

      // Keep this payload deliberately small and JSON-safe: it is both the browser-side
      // Stage-0 evidence and the limits needed to choose a bounded wgpu brick pool.
      window.newvolimProbeWebGpuCapabilities = async function () {
        const adapter = await window.newvolimProbeWebGpu();
        if (!adapter) return null;
        const limits = adapter.limits;
        const limit = (name) => Number.isFinite(limits[name]) ? limits[name] : null;
        return {
          maxTextureDimension3D: limit("maxTextureDimension3D"),
          maxBufferSize: limit("maxBufferSize"),
          maxStorageBufferBindingSize: limit("maxStorageBufferBindingSize"),
          maxStorageBuffersPerShaderStage: limit("maxStorageBuffersPerShaderStage"),
          maxBindGroups: limit("maxBindGroups"),
        };
      };

      // The compact browser ray marcher represents physical extent as one positive scale per
      // spatial axis. Compose every NGFF scale operation from the multiscale and dataset scopes
      // in declared order; translations do not change extent, while affine transforms must not
      // be silently reduced to a scalar spacing.
      window.newvolimComposeBrowserSpacing = function (axes, multiscaleTransforms, datasetTransforms) {
        const axisIndex = name => axes.findIndex(axis => axis.name?.toLowerCase() === name);
        const [c, z, y, x] = [axisIndex("c"), axisIndex("z"), axisIndex("y"), axisIndex("x")];
        const spatial = [z, y, x];
        if (spatial.some(index => index < 0) || new Set(spatial).size !== 3
          || (c >= 0 && spatial.includes(c)) || !(axes.length === 3 || (axes.length === 4 && c >= 0))) {
          throw new Error("browser preview requires Z, Y, X and at most one C axis");
        }
        const scale = Array(axes.length).fill(1);
        for (const transform of [...(multiscaleTransforms || []), ...(datasetTransforms || [])]) {
          if (!transform || typeof transform.type !== "string") {
            throw new Error("browser preview encountered invalid NGFF coordinate transformations");
          }
          if (transform.type === "scale") {
            if (!Array.isArray(transform.scale) || transform.scale.length !== axes.length
              || transform.scale.some(value => !Number.isFinite(value) || value <= 0)) {
              throw new Error("browser preview requires positive per-axis NGFF scale values");
            }
            for (let index = 0; index < scale.length; index += 1) scale[index] *= transform.scale[index];
          } else if (transform.type === "translation" || transform.type === "identity") {
            if (transform.type === "translation"
              && (!Array.isArray(transform.translation) || transform.translation.length !== axes.length
                || transform.translation.some(value => !Number.isFinite(value)))) {
              throw new Error("browser preview requires finite per-axis NGFF translations");
            }
          } else {
            throw new Error(`browser preview cannot represent NGFF ${transform.type} transforms`);
          }
        }
        return { c, z, y, x, spacing: [scale[x], scale[y], scale[z], 0] };
      };

      // Convert OMERO's display metadata at the browser boundary. The GPU receives only
      // validated, linear-light colours and finite native-unit windows; it never has to guess
      // which channel metadata or colour encoding a Zarr store meant.
      window.newvolimBrowserChannelTransfers = function (omeroChannels, channelCount) {
        if (!Number.isSafeInteger(channelCount) || channelCount < 1 || channelCount > 4) {
          throw new Error("browser preview supports one to four channels");
        }
        const srgbToLinear = value => value <= 0.04045 ? value / 12.92 : Math.pow((value + 0.055) / 1.055, 2.4);
        return Array.from({ length: channelCount }, (_, index) => {
          const channel = Array.isArray(omeroChannels) ? omeroChannels[index] : null;
          const colorText = typeof channel?.color === "string" && /^[0-9a-fA-F]{6}$/.test(channel.color)
            ? channel.color : "F2281F";
          const color = [0, 2, 4].map(offset => srgbToLinear(parseInt(colorText.slice(offset, offset + 2), 16) / 255));
          const metadataWindow = channel?.window;
          const window = Number.isFinite(metadataWindow?.start) && Number.isFinite(metadataWindow?.end)
            && metadataWindow.end > metadataWindow.start
            ? [metadataWindow.start, metadataWindow.end] : [0, 65535];
          // OMERO's active flag is the portable visibility contract. It is represented as zero
          // opacity rather than omitting a binding, so the shader layout stays fixed and bounded.
          return { colorText, color, window, opacity: channel?.active === false ? 0 : 1 };
        });
      };

      // Split a bounded multi-channel Zarr chunk into one tightly packed spatial page. Zarr's
      // C axis may appear anywhere in the declared order, so this copies uint16 byte pairs by
      // the declared chunk strides instead of assuming C is the outermost dimension.
      window.newvolimExtractBrowserChannelPage = function (bytes, chunkShape, axes, channel) {
        const { c, z, y, x } = axes;
        if (!ArrayBuffer.isView(bytes) || bytes.BYTES_PER_ELEMENT !== 1 || !Array.isArray(chunkShape)
          || !Number.isSafeInteger(channel) || channel < 0 || c < 0
          || [c, z, y, x].some(axis => !Number.isSafeInteger(axis) || axis < 0 || axis >= chunkShape.length)
          || channel >= chunkShape[c]) {
          throw new Error("browser channel-page extraction received invalid chunk metadata");
        }
        const words = chunkShape.reduce((product, extent) => product * extent, 1);
        if (chunkShape.some(extent => !Number.isSafeInteger(extent) || extent < 1) || bytes.byteLength !== words * 2) {
          throw new Error("browser channel-page extraction received an invalid decoded chunk");
        }
        const spatial = chunkShape[x] * chunkShape[y] * chunkShape[z];
        const page = new Uint8Array(spatial * 2);
        const stride = chunkShape.map((_, axis) => chunkShape.slice(axis + 1).reduce((product, extent) => product * extent, 1));
        for (let zi = 0; zi < chunkShape[z]; zi += 1) for (let yi = 0; yi < chunkShape[y]; yi += 1) for (let xi = 0; xi < chunkShape[x]; xi += 1) {
          const sourceWord = channel * stride[c] + zi * stride[z] + yi * stride[y] + xi * stride[x];
          const targetWord = (zi * chunkShape[y] + yi) * chunkShape[x] + xi;
          page[targetWord * 2] = bytes[sourceWord * 2];
          page[targetWord * 2 + 1] = bytes[sourceWord * 2 + 1];
        }
        return page;
      };

      // The chunk input is deliberately semantic Z,Y,X, whereas NGFF arrays may declare those
      // axes in any order. Convert once at the metadata boundary before using the coordinates
      // for bounds checks, URLs, or brick placement. Keeping this separate prevents an X,Y,Z
      // array from silently treating an entered Z coordinate as X.
      window.newvolimAxisOrderedChunkCoordinates = function ({ c = -1, z, y, x }, zyxCoordinate) {
        if (!Array.isArray(zyxCoordinate) || zyxCoordinate.length !== 3) {
          throw new Error("browser chunk coordinate must be three Z,Y,X values");
        }
        const coordinates = Array(Math.max(c, z, y, x) + 1).fill(0);
        coordinates[z] = zyxCoordinate[0];
        coordinates[y] = zyxCoordinate[1];
        coordinates[x] = zyxCoordinate[2];
        return coordinates;
      };

      // Dataset paths arrive in untrusted root metadata. They identify an array below the
      // selected store root, not an arbitrary URL relative to its origin. Check both the raw
      // and percent-decoded forms because URL resolution recognizes encoded dot segments.
      window.newvolimNormalBrowserDatasetPath = function (path) {
        if (typeof path !== "string") throw new Error("browser NGFF dataset path must be a string");
        const normalized = path.replace(/^\/+|\/+$/g, "");
        if (!normalized) throw new Error("browser NGFF dataset path must not be empty");
        for (const segment of normalized.split("/")) {
          let decoded;
          try { decoded = decodeURIComponent(segment); } catch (_) {
            throw new Error("browser NGFF dataset path has invalid percent encoding");
          }
          if (!decoded || decoded === "." || decoded === ".." || decoded.includes("/")
            || decoded.includes("\\") || decoded.includes("?") || decoded.includes("#")
            || /[\u0000-\u001f\u007f]/.test(decoded)) {
            throw new Error("browser NGFF dataset path must be normal-relative");
          }
        }
        return normalized;
      };

      window.newvolimDirectBrowserStoreRoot = function (rawUrl) {

      window.newvolimDrawOrthogonal = async function (args, command = "render_synthetic_orthogonal_preview") {

      window.newvolimCrosshair = { x: 32, y: 32, z: 32 };

      const NEWVOLIM_MAX_POLYGON_VERTICES = 4096;
      window.newvolimDrawCrosshair = function (context, plane, width, height) {
        const point = window.newvolimCrosshair;
        const [horizontal, vertical] = plane === "xy" ? [point.x, point.y]
          : plane === "xz" ? [point.x, point.z]
          : [point.y, point.z];
        const viewport = window.newvolimOrthogonalViewport;
        const origin = viewport?.origin || [0, 0, 0];
        const dimensions = viewport?.dimensions || window.newvolimCrosshairDimensions || [64, 64, 64];
        const local = [point.x - origin[0], point.y - origin[1], point.z - origin[2]];
        const [horizontalDimension, verticalDimension] = plane === "xy" ? [dimensions[0], dimensions[1]]
          : plane === "xz" ? [dimensions[0], dimensions[2]]
          : [dimensions[1], dimensions[2]];
        const [localHorizontal, localVertical] = plane === "xy" ? [local[0], local[1]]
          : plane === "xz" ? [local[0], local[2]] : [local[1], local[2]];
        const x = localHorizontal / horizontalDimension * width;
        const y = localVertical / verticalDimension * height;
        context.save();
        context.strokeStyle = "#53d8ff";
        context.lineWidth = Math.max(1, width / 512);
        context.beginPath();
        context.moveTo(x, 0); context.lineTo(x, height);
        context.moveTo(0, y); context.lineTo(width, y);
        context.stroke();
        context.restore();
      };
      window.newvolimDrawAnnotations = function (context, plane, width, height) {
        const viewport = window.newvolimOrthogonalViewport;
        const origin = viewport?.origin || [0, 0, 0];
        const dimensions = viewport?.dimensions || window.newvolimCrosshairDimensions || [64, 64, 64];
        const point = window.newvolimCrosshair;
        for (const marker of window.newvolimAnnotationMarkers) {
          const points = marker.voxelPoints;
          if (!Array.isArray(points) || !points.length) continue;
          const visible = points.every(([x, y, z]) => plane === "xy" ? z === point.z
            : plane === "xz" ? y === point.y
            : x === point.x);
          if (!visible) continue;
          const [horizontalDimension, verticalDimension] = plane === "xy"
            ? [dimensions[0], dimensions[1]]
            : plane === "xz" ? [dimensions[0], dimensions[2]]
            : [dimensions[1], dimensions[2]];
          const project = ([x, y, z]) => plane === "xy" ? [x - origin[0], y - origin[1]]
            : plane === "xz" ? [x - origin[0], z - origin[2]]
            : [y - origin[1], z - origin[2]];
          const color = marker.annotation.color_srgb || [255, 216, 72];
          context.save();
          context.strokeStyle = `rgb(${color[0]}, ${color[1]}, ${color[2]})`;
          context.lineWidth = Math.max(1, width / 256);
          context.beginPath();
          const [firstHorizontal, firstVertical] = project(points[0]);
          if (points.length === 1) {
            context.arc(
              (firstHorizontal + 0.5) / horizontalDimension * width,
              (firstVertical + 0.5) / verticalDimension * height,
              Math.max(4, width / 80), 0, Math.PI * 2,
            );
          } else {
            context.moveTo(
              (firstHorizontal + 0.5) / horizontalDimension * width,
              (firstVertical + 0.5) / verticalDimension * height,
            );
            for (const vertex of points.slice(1)) {
              const [horizontal, vertical] = project(vertex);
              context.lineTo(
                (horizontal + 0.5) / horizontalDimension * width,
                (vertical + 0.5) / verticalDimension * height,
              );
            }
            const geometry = marker.annotation.geometry || {};
            if (geometry.Polygon || geometry.Rectangle || geometry.Ellipse) context.closePath();
          }
          context.stroke();
          context.restore();
        }
      };
      window.newvolimMoveCrosshair = function (plane, event, command) {
        const canvas = event.currentTarget;
        const rect = canvas.getBoundingClientRect();
        const viewport = window.newvolimOrthogonalViewport;
        const origin = viewport?.origin || [0, 0, 0];
        const dimensions = viewport?.dimensions || window.newvolimCrosshairDimensions || [64, 64, 64];
        const [horizontalDimension, verticalDimension] = plane === "xy" ? [dimensions[0], dimensions[1]]
          : plane === "xz" ? [dimensions[0], dimensions[2]]
          : [dimensions[1], dimensions[2]];
        const horizontal = Math.max(0, Math.min(horizontalDimension - 1, Math.floor((event.clientX - rect.left) / rect.width * horizontalDimension)));
        const vertical = Math.max(0, Math.min(verticalDimension - 1, Math.floor((event.clientY - rect.top) / rect.height * verticalDimension)));
        const point = window.newvolimCrosshair;
        const draft = window.newvolimPolygonDraft;
        if (draft && draft.plane && draft.plane !== plane) {
          document.getElementById("newvolim-render-status").textContent =
            `Polygon ROI started on ${draft.plane.toUpperCase()}; finish or use that pane for vertices`;
          return;
        }
        const maximumDraftPoints = draft && draft.kind === "polygon" ? NEWVOLIM_MAX_POLYGON_VERTICES : 2;
        if (draft && draft.points.length >= maximumDraftPoints) {
          document.getElementById("newvolim-render-status").textContent =
            `${draft.kind === "polygon" ? "Polygon" : draft.kind} ROI is limited to ${maximumDraftPoints} corners; finish or start a new ROI`;
          return;
        }
        if (plane === "xy") { point.x = origin[0] + horizontal; point.y = origin[1] + vertical; }
        if (plane === "xz") { point.x = origin[0] + horizontal; point.z = origin[2] + vertical; }
        if (plane === "yz") { point.y = origin[1] + horizontal; point.z = origin[2] + vertical; }
        if (draft) {
          if (!draft.plane) draft.plane = plane;
          draft.points.push([point.x, point.y, point.z]);
          const required = draft.kind === "polygon" ? 3 : 2;
          document.getElementById("newvolim-render-status").textContent =
            `${draft.kind === "polygon" ? "Polygon" : draft.kind} ROI corner ${draft.points.length}; add at least ${Math.max(0, required - draft.points.length)} more then finish`;
        }
        if (command === "remote") {
          window.newvolimRequestRemoteFrame(window.newvolimCamera, "orthogonal", point);
          return;
        }
        if (command === "render_native_portable_orthogonal") {
          const volumeCanvas = document.getElementById("newvolim-volume");
          window.newvolimScheduleOrthogonal({
            request: window.newvolimNativePortableDrawRequest(volumeCanvas, window.newvolimCamera),
            x: point.x, y: point.y, z: point.z,
          }, command);
          return;
        }
        window.newvolimScheduleOrthogonal({
          width: canvas.width,
          height: canvas.height,
          x: point.x,
          y: point.y,
          z: point.z,
        }, command);
        if (window.newvolimNativePortableActive) window.newvolimScheduleVolumeCamera();
      };
