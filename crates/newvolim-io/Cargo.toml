[package]
name = "newvolim-io"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "OME-NGFF metadata and coordinate transforms for newvolim"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
opendal = { version = "0.58", features = ["services-s3"] }
pollster = "1"
zarrs = { version = "0.18", features = ["filesystem"] }

[dev-dependencies]
tempfile = "3"
