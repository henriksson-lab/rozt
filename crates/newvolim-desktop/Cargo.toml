[package]
name = "newvolim-desktop"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "Tauri desktop host for the newvolim CSR UI"
build = "build.rs"

[build-dependencies]
tauri-build = "2.6.3"

[dependencies]
base64 = "0.22"
newvolim-io = { path = "../newvolim-io" }
newvolim-render = { path = "../newvolim-render" }
newvolim-wgpu-frame = { path = "../newvolim-wgpu-frame" }
newvolim-scene = { path = "../newvolim-scene" }
palace-frame = { path = "../../palace-dev/palace-frame" }
palace-png = { path = "../../palace-dev/palace-png" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = [] }

[dev-dependencies]
tempfile = "3"
